spring.application.name=secure-auth
server.port=8080

# --- Дерекқор: әдепкі H2 (жадта), орнатуды қажет етпейді ---
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# H2 консолі қауіпсіздік үшін өшірулі
spring.h2.console.enabled=false

# --- Сессия cookie қауіпсіздігі ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-stacktrace=never

# --- Brute-force қорғау параметрлері ---
security.login.max-attempts=5
security.login.lock-minutes=15
security.bcrypt.strength=12

# --- Әкімші (admin) аккаунты: құпия сөз кодта сақталмайды ---
# ADMIN_PASSWORD орнатылмаса, іске қосылғанда кездейсоқ құпия сөз генерацияланып, консольге бір рет шығады
app.admin.email=${ADMIN_EMAIL:admin@shop.kz}
app.admin.password=${ADMIN_PASSWORD:}
